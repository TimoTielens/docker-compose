services:
  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    hostname: ${PAPERLESS_NAME:? paperless name required}
    container_name: ${PAPERLESS_NAME:? paperless name required}
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://redis:6379




  paperless:
    image: portainer/portainer-ce:${PORTAINER_IMAGE_VERSION:? portainer image version required}
    hostname: ${PORTAINER_NAME:? portainer name required}
    container_name: ${PORTAINER_NAME:? portainer name required}
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:? timezone required}
    ports:
      - 8000:8000 
      - 9443:9443
    volumes:
      - ./portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
